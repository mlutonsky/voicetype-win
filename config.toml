# voicetype-win - configuration
# Restart the app after changing anything here.

# Toggle hotkey (start/stop recording).
# Examples: "alt+.", "ctrl+alt+space", "win+alt+d"
hotkey = "alt+."

# ASR model (keep as is if unsure). Multilingual; see README for switching models.
model = "nemo-parakeet-tdt-0.6b-v3"

# Compute device: "auto" (GPU, CPU fallback) | "gpu" | "cpu"
device = "auto"

# Transcription language: "auto" (detect) or a code like "cs", "en", "de", ...
language = "auto"

# App UI language (tray, logs): "auto" (follow Windows), "en" or "cs".
ui_language = "auto"

# Punctuation and capitalization (recommended true for dictation).
punctuation = true

# Append a space after the inserted text (separates consecutive dictations).
append_space = true

# Sound feedback on recording start/stop.
beep = true

# Text insertion: "clipboard" (clipboard + Ctrl+V, robust for accents)
#                 "type" (simulated key typing)
paste_method = "clipboard"

# Restore the previous clipboard content after pasting (only for paste_method = "clipboard").
restore_clipboard = true

# Pause playing media (YouTube, Spotify, ...) while recording and resume it afterwards.
pause_media = true
